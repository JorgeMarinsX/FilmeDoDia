<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Filme do dia</title>
</head>
<body class="bg-light text-dark d-flex flex-column min-vh-100">

    <nav class="navbar bg-primary" data-bs-theme="dark">
        <div class="container">
            <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
                <img src="static/icon.png" alt="Logo" width="32" height="32">
                Filme do dia
            </span>
            <span class="navbar-text ms-auto">o fim definitivo de todas as brigas</span>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4 text-center py-5">

            <p class="text-secondary fst-italic mb-3">Estão brigando para decidir o filme? Vamos escolher o filme de vocês hoje:</p>

            <h1 class="display-5 fw-bold mb-4">Filme do dia</h1>

            <!-- Filtros -->
            <fieldset class="card shadow-sm mb-4 text-start">
                <div class="card-body pb-2">
                    <legend class="col-form-label fw-semibold text-secondary small text-uppercase mb-2">Filtros</legend>
                    <div class="row row-cols-1 row-cols-sm-2 g-2">
                        <div class="col">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="excluir-terror">
                                <label class="form-check-label" for="excluir-terror">Excluir filmes de Terror</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="excluir-comedia">
                                <label class="form-check-label" for="excluir-comedia">Excluir Comédias Românticas</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="excluir-adulto" checked>
                                <label class="form-check-label" for="excluir-adulto">Excluir filmes adultos</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="excluir-nota">
                                <label class="form-check-label" for="excluir-nota">Excluir nota menor que 70%</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="excluir-series">
                                <label class="form-check-label" for="excluir-series">Excluir séries</label>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <button id="btn-buscar" class="btn btn-primary btn-lg mb-4">Buscar filme</button>


        </div>
    </main>

    <footer class="py-3 bg-primary" data-bs-theme="dark">
        <div class="container text-center">
            <span class="navbar-text text-white">Desenvolvido com ♥ por Jorge Marins | <a href="https://buymeacoffee.com/jorgemarins" target="_blank" class="text-white fw-semibold">Que tal me pagar um café? ☕</a></span>
        </div>
    </footer>

    <script src="src/main.js"></script>
</body>
</html>
