name: Deploy | Github Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Debug secret
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: echo "Key length = ${#TMDB_API_KEY}"

      - name: Inject API Key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: sed -i "s/TMDB_API_KEY_PLACEHOLDER/${TMDB_API_KEY}/g" src/main.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
